name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scripts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Validate shell and Compose invariants
        run: bash tests/validate.sh

      - name: Run ShellCheck
        run: >-
          shellcheck --severity=warning
          proxmox_lxc.sh
          install_media.sh
          media_stack.sh
          update_stack.sh
          sync_transmission_port.sh
